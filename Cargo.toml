[package]
name = "dev-fixtures"
version = "0.9.4"
edition = "2021"
rust-version = "1.85"
readme = "README.md"
license = "Apache-2.0"

authors = [
    "James Gober <me@jamesgober.com>"
]

description = "Deterministic test fixtures for Rust: disposable project trees, golden-file snapshots, controlled mock data, file-tree builders. Part of the dev-* verification collection."

keywords = [
    "testing",
    "fixtures",
    "tempdir",
    "snapshot",
    "golden"
]

categories = [
    "development-tools",
    "development-tools::testing",
    "filesystem"
]

documentation = "https://docs.rs/dev-fixtures"
repository = "https://github.com/jamesgober/dev-fixtures"
homepage = "https://github.com/jamesgober/dev-fixtures"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
tempfile = "3"
dev-report = { version = "0.9", path = "../dev-report" }

[dev-dependencies]

[features]
default = []

[profile.release]
opt-level = 3
lto = "thin"

[package]
name = "dev-fixtures"
version = "0.9.5"
edition = "2021"
rust-version = "1.75"
readme = "README.md"
license = "Apache-2.0"

authors = [
    "James Gober <me@jamesgober.com>"
]

description = "Deterministic test fixtures for Rust: disposable project trees, golden-file snapshots, controlled mock data, file-tree builders. Part of the dev-* verification collection."

keywords = [
    "testing",
    "fixtures",
    "tempdir",
    "snapshot",
    "golden"
]

categories = [
    "development-tools",
    "development-tools::testing",
    "filesystem"
]

documentation = "https://docs.rs/dev-fixtures"
repository = "https://github.com/jamesgober/dev-fixtures"
homepage = "https://github.com/jamesgober/dev-fixtures"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Swapped from `tempfile = "3"` to mod-tempdir 1.0 in v0.9.5 — drops
# the transitive `getrandom 0.4.2 → edition2024` chain that was the
# sole blocker keeping the `dev-*` collection at MSRV 1.85. mod-tempdir
# is a drop-in replacement with the same RAII auto-cleanup semantics.
mod-tempdir = { version = "1", path = "../mod-tempdir" }
dev-report = { version = "0.9", path = "../dev-report" }

[dev-dependencies]

[features]
default = []

[profile.release]
opt-level = 3
lto = "thin"
